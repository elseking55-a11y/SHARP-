name: Node.js compatibility

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate brand CSS
        run: npm run generate:brand-css

      - name: Validate managed site registry
        run: node scripts/validate-site-registry.js

      - name: Validate free bot assets
        run: node scripts/validate-free-bots.js

      - name: Validate managed site customization
        run: node scripts/validate-site-customization.js

      - name: Type check
        run: npm run type-check

      - name: Build production bundle
        run: npm run build
